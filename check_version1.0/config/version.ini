; 在 [Version] 中维护允许通过校验的卡片 DE 值。
; 程序发送 80CA00DE00，并将返回结果与下列值逐项比对。
; 可填写 DE 的 Value（例如 012B）或完整 TLV（例如 DE02012B）。
; 每个值必须为偶数位十六进制字符。

[Version]
version_1 = DE02012B
version_2 = DE020120
version_3 = DE02012D
version_4 = 0107

; CPLC: compare the first 6 bytes of Value, excluding the 9F7F tag and length.
; CPLC 校验：只填写数据值前 6 字节（12 位十六进制），不包含标签和长度。
; Add prefix_2, prefix_3, etc. to allow more values.
[CPLC]
prefix_1 = 81002DD3484F
prefix_2 = 00760089484F
